<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in – CityCare Hospital</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">
  <main class="login-card">
    <h1>CityCare Hospital</h1>
    <p class="sub">Sign in to the management portal</p>
    <form id="loginForm">
      <label>Role<select id="role">
          <option value="admin">Admin</option>
          <option value="reception">Receptionist</option>
          <option value="doctor">Doctor</option>
          <option value="patient">Patient</option>
        </select></label>
      <label>Username<input id="username" required autocomplete="username"></label>
      <label>Password<input id="password" type="password" required autocomplete="current-password"></label>
      <p id="err" class="err" role="alert"></p>
      <button class="btn" type="submit">Sign in</button>
    </form>
    <p class="hint">Demo logins – admin / admin123 · rec / rec123 · drsaini / doc123 · rahul / pat123</p>
  </main>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
</body>

</html>
